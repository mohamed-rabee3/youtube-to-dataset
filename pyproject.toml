[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2ds"
version = "0.1.0"
description = "YouTube -> Arabic TTS/voice-cloning dataset pipeline (VAD, diarization, music rejection, verified transcripts)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    # torch/torchaudio are installed separately by scripts/setup.sh so the
    # CUDA build can be pinned to the right index. audio-separator (vocal
    # isolation) is installed there too, with --no-deps: its bare `torch>=2.3`
    # would otherwise pull a build without CUDA over the pinned one.
    # Default ASR backend (asr.backend: google).
    "google-cloud-speech>=2.27",
    # asr.backend: google_batch uploads audio for V2 BatchRecognize, which
    # only reads from Cloud Storage.
    "google-cloud-storage>=2.18",
    # The cohere ASR backend and the aligner.
    "transformers>=5.4",
    "accelerate>=1.1",
    "yt-dlp>=2026.7.4",
    "silero-vad>=6.0",
    "demucs>=4.0",
    "speechbrain>=1.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "numpy",
    "scipy",
    "scikit-learn",
    "uroman>=1.3",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
yt2ds = "yt2ds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
